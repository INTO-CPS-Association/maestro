
name: Manual Github Release

on:
  workflow_dispatch:
    inputs:
      releasetag:
        description: 'Release tag'
        required: true
      previousreleasetag:
        description: 'Previous Release tag'
        required: true


jobs:


  final:
    name: Create release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: 'true'
          ref: ${{ github.event.inputs.releasetag }}

      - name: Resolve release version
        id: release_version
        env:
          RELEASE_TAG: ${{ inputs.releasetag }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#Release/}"
          if [[ "$RELEASE_VERSION" == "$RELEASE_TAG" || -z "$RELEASE_VERSION" ]]; then
            echo "Expected a tag in the form Release/<version>" >&2
            exit 1
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Create changelog config
        run: echo '{"max_back_track_time_days":1095}' > configuration.json

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6.5.0
        with:
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}\n\n<details>\n<summary>Uncategorized</summary>\n\n#{{UNCATEGORIZED}}\n</details>",
              "categories": [
                {
                    "title": "## 🚀 Features",
                    "labels": ["feature"]
                },
                {
                    "title": "## 🐛 Fixes",
                    "labels": ["fix"]
                },
                {
                    "title": "## 🧪 Tests",
                    "labels": ["test"]
                },
                {
                    "title": "## 💬 Other",
                    "labels": ["other"]
                },
                {
                    "title": "## 📦 Dependencies",
                    "labels": ["dependencies"]
                }
              ]
            }
          toTag: ${{ github.event.inputs.releasetag }}
          fromTag: ${{ github.event.inputs.previousreleasetag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.releasetag }}
          name: ${{ github.event.inputs.releasetag }}
          body: |
            Grab the new version from Maven Central https://central.sonatype.com/artifact/org.into-cps.maestro/maestro/${{ steps.release_version.outputs.version }}
            and https://central.sonatype.com/artifact/org.into-cps.maestro/maestro-webapi/${{ steps.release_version.outputs.version }}:

            ```
            <dependency>
              <groupId>org.into-cps.maestro</groupId>
              <artifactId>maestro</artifactId>
              <version>${{ steps.release_version.outputs.version }}</version>
            </dependency>
            
            <dependency>
              <groupId>org.into-cps.maestro</groupId>
              <artifactId>maestro-webapi</artifactId>
              <version>${{ steps.release_version.outputs.version }}</version>
            </dependency>
            ```
            
          
            
            
            ### Things that changed in this release
            ${{ steps.changelog.outputs.changelog }}
          draft: true
          prerelease: true



