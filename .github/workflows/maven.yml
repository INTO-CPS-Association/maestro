# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Maestro2

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - master
  pull_request:

permissions:
  contents: read

env:

  SERVER_ID: ossrh
  PYTHON_VERSION: '3.12'
  MAVEN_VERSION: 3.9.16
  WINDOWS_VERSION: 'windows-2025'

  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.httpconnectionManager.ttlSeconds=120 -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn



jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, windows-2025, macos-26-intel ]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Use Java version 21 adopt
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: ${{ env.MAVEN_VERSION }}

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libzip
            mingw-w64-ucrt-x86_64-gcc

          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p

#      - name: Put MSYS2 on PATH
#        if: runner.os == 'Windows'
#        run: |
#          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
#
#      - name: Install C++ toolchain
#        if: runner.os == 'Windows'
#        shell: msys2 {0}
#        run: |
#          pacman -S --noconfirm mingw-w64-ucrt-x86_64-gcc
#
#      - name: Put MSYS2_MinGW64 on PATH for windows
#        if: ${{matrix.os == env.WINDOWS_VERSION }}
#        # there is not yet an environment variable for this path from msys2/setup-msys2
#        # We need this to get a gcc 11.2 that is new enough to compile the reference FMU3
#        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append


      - name: Install vcpkg
        if: ${{matrix.os == env.WINDOWS_VERSION }}
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Install Zlib via vcpkg
        if: ${{matrix.os == env.WINDOWS_VERSION }}
        shell: pwsh
        run: .\vcpkg\vcpkg install zlib

      - name: Install latest CMake
        if: matrix.os == 'macos-26-intel'
        run: brew install cmake

      - name: Cache local Maven repository
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Maven Build
        run: mvn -B package --file pom.xml -DskipTests -fae

      - name: Maven Test
        if: matrix.os == env.WINDOWS_VERSION
        shell: msys2 {0}
        env:
          ZLIB_ROOT: ${{ github.workspace }}\vcpkg\installed\x64-windows
          ZLIB_LIBRARY: ${{ github.workspace }}\vcpkg\installed\x64-windows\lib\zlib.lib
          ZLIB_INCLUDE_DIR: ${{ github.workspace }}\vcpkg\installed\x64-windows\include
          CMAKE_PREFIX_PATH: ${{ github.workspace }}\vcpkg\installed\x64-windows
        run: |
          mvn -Pinclude-fullSpecCppTest test

      - name: Maven Test
        if: matrix.os != env.WINDOWS_VERSION
        run: mvn -Pinclude-fullSpecCppTest test

      #      - name: Maven Test
      #        if: matrix.os != env.WINDOWS_VERSION
      #        run: mvn test -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: upload test reports win
        uses: actions/upload-artifact@v7.0.2
        if: ${{ failure() && matrix.os == env.WINDOWS_VERSION}}

        with:
          name: surfire-win
          path: |
            **/target/surefire-reports/*
            **/target/FullSpecCppTest/spec.mabl
            **/target/FullSpecCppTest/co-sim.cxx
          retention-days: 1

      - name: upload test reports ubuntu
        uses: actions/upload-artifact@v7.0.2
        if: ${{ failure() && matrix.os == 'ubuntu-24.04' }}
        with:
          name: surfire-ubuntu
          path: |
            **/target/surefire-reports/*
          retention-days: 1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        run: |
          cd external_tester
          python -m pip install --upgrade pip
         
          pip install -r requirements.txt
        

      - name: CLI Test
        timeout-minutes: 5
        run: |
          cd external_tester
          python maestro_cli_test.py --includeSlowTests

      - name: Web API Test
        timeout-minutes: 2
        run: |
          cd external_tester
          python webapi_test.py

      - name: Legacy CLI Test
        timeout-minutes: 2
        run: |
          cd external_tester
          python cli_legacy_test.py

      #- name: Threaded Web API test
      #  timeout-minutes: 5
      #  run: |
      #    cd external_tester
      #    python test_simultaneous_simulations.py

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache local Maven repository
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Environment variables
        run: echo ${{ env.SERVER_ID }}

      - id: install-secret-key
        name: Install gpg secret key
        run: |
          cat <(echo -e "${{ secrets.OSSRH_GPG_SECRET_KEY }}") | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Use Java version 21 adopt
        uses: actions/setup-java@v6.2.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: ${{ env.SERVER_ID }}
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Set up maven
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: ${{ env.MAVEN_VERSION }}


      - name: Maven Package feature SNAPSHOT
        if: github.event_name == 'push' && (github.ref != 'refs/heads/development' && github.ref != 'refs/heads/master' )
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
          MAVEN_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$BUILD_BRANCH" | sed -E 's|[^A-Za-z0-9._-]+|-|g')
          mvn -Psonatype -B package "-Dsha1=-${SAFE_BRANCH}" -fae

      - name: Maven Package SNAPSHOT
        if: github.event_name == 'push' && (github.ref == 'refs/heads/development' )
        run: mvn -Psonatype -B deploy -Dsha1= -fae
        env:
          MAVEN_USERNAME: ${{ secrets.OSS_SONATYPE_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSS_SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}


